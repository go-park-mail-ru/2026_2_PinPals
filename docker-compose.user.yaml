services:
  user_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user_service
    container_name: user_service
    restart: unless-stopped
    ports:
      - "8003:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app-network
