global:
  scrape_interval: 15s

scrape_configs:
  - job_name: auth_service
    static_configs:
      - targets: ["auth_service:9100"]
  - job_name: pin_service
    static_configs:
      - targets: ["pin_service:9100"]
  - job_name: user_service
    static_configs:
      - targets: ["user_service:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: onlineconf_service
    static_configs:
      - targets: ["onlineconf_service:9100"]
