services:

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - app-network


  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate

    container_name: migrate

    env_file:
      - .env

    volumes:
      - ./db:/app/db:ro

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

    networks:
      - app-network


  image_storage_init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - ./templates:/source:ro
      - pin_images:/images
    entrypoint: ["/bin/sh", "-c", "cp -an /source/. /images/ 2>/dev/null || true; chown -R 65534:65534 /images"]
    restart: "no"


  auth_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=auth_service

    container_name: auth_service
    restart: unless-stopped

    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    networks:
      - app-network


  pin_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=pin_service

    container_name: pin_service
    restart: unless-stopped

    ports:
      - "8002:8000"

    env_file:
      - .env

    volumes:
      - pin_images:/app/images

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      image_storage_init:
        condition: service_completed_successfully

    networks:
      - app-network

  user_service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - SERVICE=user_service

    container_name: user_service
    restart: unless-stopped

    ports:
      - "8003:8000"

    env_file:
      - .env

    volumes:
      - pin_images:/app/images

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      image_storage_init:
        condition: service_completed_successfully

    networks:
      - app-network

networks:
  app-network:
    driver: bridge


volumes:
  postgres_data:
  minio_data:
  pin_images:
