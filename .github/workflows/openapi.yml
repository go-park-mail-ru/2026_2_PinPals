name: OpenAPI documentation

on:
  push:
    branches: [develop, RK2_combined]
    paths:
      - 'auth_service/**'
      - 'pin_service/**'
      - 'user_service/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/openapi.yml'
      - 'site/**'
  pull_request:
    branches: [develop, RK2_combined]
    paths:
      - 'auth_service/**'
      - 'pin_service/**'
      - 'user_service/**'
      - 'cmd/**'
      - 'pkg/**'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/openapi.yml'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: openapi-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate OpenAPI specifications for services present in this branch
        run: |
          for entry in "auth_service:auth" "pin_service:pin" "user_service:user"; do
            service="${entry%%:*}"
            output="${entry##*:}"
            if [ -f "cmd/${service}/main.go" ] && [ -d "${service}" ]; then
              go run github.com/swaggo/swag/cmd/swag@v1.16.6 init \
                -g main.go -d "cmd/${service},${service}" \
                -o "docs/${output}" --parseDependency --parseInternal
            fi
          done


      - name: Prepare Swagger UI site
        run: |
          mkdir -p site
          test -s site/index.html

          for spec in auth pin user; do
            if [ -f "docs/${spec}/swagger.yaml" ]; then
              mkdir -p "site/${spec}"
              cp "docs/${spec}/swagger.yaml" "site/${spec}/openapi.yaml"

              cat > "site/${spec}/index.html" <<'HTML'
          <!doctype html>
          <html lang="ru">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>PinPals API — Swagger UI</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui.css">
          </head>
          <body>
            <div id="swagger-ui"></div>

            <script src="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui-bundle.js" crossorigin></script>
            <script src="https://unpkg.com/swagger-ui-dist@5.34.1/swagger-ui-standalone-preset.js" crossorigin></script>

            <script>
              window.onload = function () {
                window.ui = SwaggerUIBundle({
                  url: "./openapi.yaml",
                  dom_id: "#swagger-ui",
                  deepLinking: true,
                  displayRequestDuration: true,
                  presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                  ],
                  layout: "StandaloneLayout"
                });
              };
            </script>
          </body>
          </html>
          HTML
            fi
          done


      - name: Upload specifications as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinpals-openapi-${{ github.sha }}
          path: site/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy OpenAPI documentation
        id: deployment
        uses: actions/deploy-pages@v4
